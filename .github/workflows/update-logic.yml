name: Update logic

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-action-update-logic
  cancel-in-progress: true

jobs:
  update-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Update logic
        run: sh scripts/update_logic.sh

      - name: Commit and force push
        id: commit
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No logic changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update logic"
          git push --force origin HEAD:refs/heads/gh-action-update-logic
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr_url=$(gh pr list --state open --base main --head gh-action-update-logic --json url --jq '.[0].url // empty')
          if [ -n "$pr_url" ]; then
            echo "Updated existing pull request: $pr_url"
          else
            gh pr create \
              --base main \
              --head gh-action-update-logic \
              --title "Update logic" \
              --body 'Automated logic update from `scripts/update_logic.sh`.'
          fi
