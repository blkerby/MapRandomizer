name: Update logic

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Strict: Fail if any tech or notable is Uncategorized"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: gh-action-update-logic
  cancel-in-progress: true

jobs:
  update-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Update logic
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          if [ "$STRICT" = "true" ]; then
            sh scripts/update_logic.sh --strict
          else
            sh scripts/update_logic.sh
          fi

      - name: Update release notes
        id: release-notes
        run: python python/scripts/generate_logic_release_notes.py --update

      - name: Commit and force push
        id: commit
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No logic changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update logic"
          git push --force origin HEAD:refs/heads/gh-action-update-logic
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES_STATUS: ${{ steps.release-notes.outputs.status }}
        run: |
          body_file=$(mktemp "$RUNNER_TEMP/update-logic-pr-body.XXXXXX")
          printf '%s\n' 'Automated logic update from `scripts/update_logic.sh`.' > "$body_file"
          if [ "$RELEASE_NOTES_STATUS" = "skipped" ]; then
            printf '\n%s\n' 'Release notes were skipped because the current release has no autogenerated markers. Existing release notes were left unchanged; please update them manually if needed.' >> "$body_file"
          fi
          pr_url=$(gh pr list --state open --base main --head gh-action-update-logic --json url --jq '.[0].url // empty')
          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" --body-file "$body_file"
            echo "Updated existing pull request: $pr_url"
          else
            gh pr create \
              --base main \
              --head gh-action-update-logic \
              --title "Update logic" \
              --body-file "$body_file"
          fi
