<div class="modal map-settings-modal" id="mapAreaDistinctCrossingHelpModal" tabindex="-1" data-parent-modal="mapSettingsModal">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Distinct area crossings reward</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>This reward favors connections between distinct pairs of areas. Higher values encourage more pairs of areas to connect directly. The default is 1. A value of 0 corresponds to no preference and will often result in more tree-like arrangements of areas.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
