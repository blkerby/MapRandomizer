<div class="modal map-settings-modal" id="mapSizeHelpModal" tabindex="-1" data-parent-modal="mapSettingsModal">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Map size</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>This setting determines the amount of rooms in the game.</p>
        <ul>
          <li><strong>Full:</strong> All rooms are included.</li>
          <li><strong>Small:</strong> Between about 50% and 70% of rooms are included. This is based on generating a full map and pruning away whole areas. Objectives in removed areas are excluded.</li>
        </ul>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
