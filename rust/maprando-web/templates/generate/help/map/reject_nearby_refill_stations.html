<div class="modal map-settings-modal" id="mapRejectNearbyRefillsHelpModal" tabindex="-1" data-parent-modal="mapSettingsModal">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Reject nearby refill stations</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>When enabled, maps do not allow two refill stations to be connected either directly or through a single intervening room.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
