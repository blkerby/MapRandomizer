<div class="modal map-settings-modal" id="mapSaveDistanceHelpModal" tabindex="-1" data-parent-modal="mapSettingsModal">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Save distance reward</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>A higher reward favors shorter paths to and from save stations. The default is 0.1. A value of 0.0 corresponds to no preference.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
