<div class="modal map-settings-modal" id="mapMaxGraphDiameterHelpModal" tabindex="-1" data-parent-modal="mapSettingsModal">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Max graph diameter</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>This sets the maximum distance between room parts, measured in door crossings. Fresh map generation rejects maps with a larger graph diameter. The default is 42. Leave this field blank to disable the limit.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
